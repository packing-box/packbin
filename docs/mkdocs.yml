site_author: dhondta
site_name: Pack-It-Easy! - Custom extensible executable packer
site_description: Modular and extensible executable packer for experimenting with packing techniques
site_url: https://pack-it-easy.readthedocs.io
repo_url: https://github.com/packing-box/pack-it-easy
edit_uri: edit/main/docs/pages/
copyright: Copyright &copy; 2024 Alexandre D'Hondt, Salma Merkania, Maximilien Laenen
docs_dir: pages
nav:
  - Home: index.md
extra:
  generator: false
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:alexandre.dhondt@gmail.com
      name: Contact Alex
    - icon: fontawesome/brands/github
      link: https://github.com/dhondta
      name: Alex on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/alexandre-d-2ab2aa14/
      name: Alex on LinkedIn
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/alex_dhondt
      name: Alex on Twitter
theme:
  name: material
  logo: imgs/logo.png
  favicon: imgs/logo.png
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - toc.follow
use_directory_urls: false
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
